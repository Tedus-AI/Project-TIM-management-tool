name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Syntax + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check every JavaScript file
        run: |
          set -e
          for f in $(git ls-files '*.js'); do node --check "$f"; done
      - name: Unit tests
        run: node --test tests/unit/*.test.js

  e2e:
    name: Browser E2E (headless Chromium)
    # pinned: ubuntu-latest moved to 26.04, which Playwright 1.56 cannot install Chromium dependencies for
    runs-on: ubuntu-24.04
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: E2E scenarios
        run: node tests/e2e/run.js
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures
          path: test-results/
          if-no-files-found: ignore
